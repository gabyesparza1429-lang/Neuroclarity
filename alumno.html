        // 1. SELECTOR DE TEMA EN TIEMPO REAL (Niño vs Adolescente)
        function setPortalTheme(theme) {
            currentTheme = theme;
            const body = document.body;
            
            // Remover clases anteriores de temas y fondos
            body.className = '';
            body.classList.add(`theme-${theme}`);
            
            // Resetear dots de color
            document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
            const defaultDot = document.querySelector('.color-dot[onclick*="default"]');
            if (defaultDot) defaultDot.classList.add('active');
            
            // Actualizar botones en barra demo
            document.querySelectorAll('.btn-demo-theme').forEach(btn => btn.classList.remove('active'));
            if (theme === 'infantil') {
                event.target.classList.add('active');
                
                // Textos Infantiles
                document.getElementById('student-avatar-display').textContent = "🐨";
                document.getElementById('student-name-display').textContent = "Lucas Gómez";
                document.getElementById('student-tag-display').textContent = "Alumno de Primaria";
                document.getElementById('misiones-list-title').textContent = "Misiones Pendientes";
                document.getElementById('achievements-box-title').textContent = "Mi Cofre de Estrellas";
                document.getElementById('submit-btn-text').textContent = "¡Entregar Misión Completada!";
                
                // Títulos de misiones
                document.getElementById('mission-1-title').textContent = "El Oso Pardo";
                document.getElementById('mission-1-sub').textContent = "Ciencias Naturales";
                document.getElementById('mission-2-title').textContent = "El Viaje del Delfín";
                document.getElementById('mission-2-sub').textContent = "Lectura y Español";
                document.getElementById('mission-3-title').textContent = "Reto de Estrellas";
                document.getElementById('mission-3-sub').textContent = "Desafío Cognitivo";
                
                document.getElementById('stars-display').style.display = 'flex';
                document.getElementById('adolescent-progress').style.display = 'none';
                
                showToast("🧒 Tema Infantil de Primaria activado.");
            } else {
                // Tema Adolescente
                const targetBtn = document.querySelector('button[onclick="setPortalTheme(\'adolescente\')"]');
                if (targetBtn) targetBtn.classList.add('active');
                
                // Textos de Adolescente
                document.getElementById('student-avatar-display').textContent = "🎧";
                document.getElementById('student-name-display').textContent = "Lucas Gómez";
                document.getElementById('student-tag-display').textContent = "Estudiante de Secundaria";
                document.getElementById('misiones-list-title').textContent = "Proyectos Académicos";
                document.getElementById('achievements-box-title').textContent = "Meta de Avance Semanal";
                document.getElementById('submit-btn-text').textContent = "Completar y Registrar Progreso";
                
                // Títulos de proyectos más maduros
                document.getElementById('mission-1-title').textContent = "Biodiversidad: El Oso Pardo";
                document.getElementById('mission-1-sub').textContent = "Ecología & Ciencias";
                document.getElementById('mission-2-title').textContent = "Análisis: El Delfín del Amazonas";
                document.getElementById('mission-2-sub').textContent = "Comprensión Lectora";
                document.getElementById('mission-3-title').textContent = "Dinámica de Atención";
                document.getElementById('mission-3-sub').textContent = "Ejercitación Cognitiva";
                
                document.getElementById('stars-display').style.display = 'none';
                document.getElementById('adolescent-progress').style.display = 'block';
                
                showToast("🎧 Tema Adolescente de Secundaria activado.");
            }
            
            // Recargar vista para aplicar layouts de misiones del tema correspondiente
            loadMission(activeMissionId);
        }

        // Lógica para cambiar dinámicamente el color de fondo personalizado del adolescente
        function changeAdolescentBg(bgClass, dotElement) {
            const body = document.body;
            
            // Limpiar clases de fondo anteriores
            body.classList.remove('bg-verde-bosque', 'bg-gris-tormenta', 'bg-cacao-calido');
            
            // Remover marca activa de todos los círculos
            document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
            
            // Agregar el fondo nuevo si no es el por defecto
            if (bgClass !== 'default') {
                body.classList.add(`bg-${bgClass}`);
                showToast(`🎨 Fondo cambiado: modo de alta legibilidad activado.`);
            } else {
                showToast(`🎨 Fondo restaurado al tono original.`);
            }
            
            // Marcar el círculo actual como activo
            dotElement.classList.add('active');
        }
