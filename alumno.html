<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroClarity - Portal del Alumno</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Afacad+Flux:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-crema: #F7F4EE;
            --morado-oscuro: #473363;
            --morado-claro: #6A4C93;
            --texto-principal: #2C2536;
            --blanco: #FFFFFF;
            --borde-suave: #E6E1ED;
            --sombra-elegante: 0 10px 30px rgba(44, 37, 54, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Afacad Flux', sans-serif;
        }

        body {
            background-color: var(--bg-crema);
            color: var(--texto-principal);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: 'Comfortaa', cursive;
            color: var(--morado-oscuro);
            font-weight: 700;
        }

        /* CABECERA INSTITUTIONAL (De lado a lado - 200px) */
        .brand-header-full {
            width: 100%;
            height: 200px;
            background-color: #F1EBE1;
            border-bottom: 2px solid var(--borde-suave);
            overflow: hidden;
        }

        .brand-header-full img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* CONTENEDOR CENTRAL DE BIENVENIDA */
        .workspace-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            text-align: center;
        }

        .welcome-header {
            margin-bottom: 35px;
            position: relative;
        }

        .welcome-header h2 {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .btn-audio-guide {
            background-color: var(--blanco);
            border: 1px solid var(--borde-suave);
            padding: 10px 20px;
            border-radius: 20px;
            color: var(--morado-claro);
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--sombra-elegante);
            transition: all 0.2s ease;
            margin-top: 5px;
        }

        .btn-audio-guide:hover {
            background-color: var(--morado-pale, #F2EDFA);
            transform: scale(1.02);
        }

        /* SECCIONES DE AVATARES */
        .category-section {
            background-color: var(--blanco);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--borde-suave);
            box-shadow: var(--sombra-elegante);
            margin-bottom: 35px;
            text-align: left;
        }

        .category-section h3 {
            font-size: 20px;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--bg-crema);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
        }

        .avatar-card {
            background-color: var(--bg-crema);
            border: 1px solid var(--borde-suave);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .avatar-card:hover {
            border-color: var(--morado-claro);
            background-color: var(--blanco);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(106, 76, 147, 0.1);
        }

        .avatar-emoji {
            font-size: 45px;
            margin-bottom: 10px;
            display: block;
        }

        .avatar-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--texto-principal);
        }
    </style>
</head>
<body>

    <!-- CABECERA DE LADO A LADO -->
    <header class="brand-header-full">
        <img src="assets/Encabezado-Web.png" alt="NeuroClarity Banner">
    </header>

    <div class="workspace-container">
        
        <div class="welcome-header">
            <h2>¡Hola! Qué alegría verte hoy</h2>
            <button class="btn-audio-guide" onclick="leerInstruccion()">
                <i class="fa-solid fa-volume-high"></i> Escuchar instrucción
            </button>
        </div>

        <!-- CATEGORÍA 1: INFANTIL (NIÑOS) -->
        <section class="category-section">
            <h3><i class="fa-solid fa-child" style="color: var(--morado-claro);"></i> Espacio Infantil</h3>
            <div class="avatar-grid">
                <div class="avatar-card" onclick="entrarComo('Koala')">
                    <span class="avatar-emoji">🐨</span>
                    <span class="avatar-name">Koala</span>
                </div>
                <div class="avatar-card" onclick="entrarComo('Dinosaurio')">
                    <span class="avatar-emoji">🦖</span>
                    <span class="avatar-name">Dinosaurio</span>
                </div>
                <div class="avatar-card" onclick="entrarComo('Leoncito')">
                    <span class="avatar-emoji">🦁</span>
                    <span class="avatar-name">Leoncito</span>
                </div>
                <div class="avatar-card" onclick="entrarComo('Zorrito')">
                    <span class="avatar-emoji">🦊</span>
                    <span class="avatar-name">Zorrito</span>
                </div>
            </div>
        </section>

        <!-- CATEGORÍA 2: JUVENIL (ADOLESCENTES) -->
        <section class="category-section">
            <h3><i class="fa-solid fa-user-astronaut" style="color: var(--morado-claro);"></i> Espacio Juvenil</h3>
            <div class="avatar-grid">
                <div class="avatar-card" onclick="entrarComo('Astronauta')">
                    <span class="avatar-emoji">🚀</span>
                    <span class="avatar-name">Astronauta</span>
                </div>
                <div class="avatar-card" onclick="entrarComo('Música')">
                    <span class="avatar-emoji">🎧</span>
                    <span class="avatar-name">Música</span>
                </div>
                <div class="avatar-card" onclick="entrarComo('Creativo')">
                    <span class="avatar-emoji">🎨</span>
                    <span class="avatar-name">Creativo</span>
                </div>
                <div class="avatar-card" onclick="entrarComo('Gamer')">
                    <span class="avatar-emoji">🎮</span>
                    <span class="avatar-name">Gamer</span>
                </div>
            </div>
        </section>

    </div>

    <script>
        // Lectura asistida por voz para accesibilidad completa
        function leerInstruccion() {
            const texto = "Haz clic en tu avatar favorito para entrar a tu espacio de estudio.";
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'es-MX';
            window.speechSynthesis.speak(utterance);
        }

        // Lógica de acceso temporal
        function entrarComo(perfil) {
            alert("Accediendo al espacio adaptado de: " + perfil);
            // Aquí cargaremos el espacio de lectura inmersiva en la siguiente etapa
        }
    </script>
</body>
</html>
