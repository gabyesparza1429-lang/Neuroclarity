<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <title>NeuroClarity | Iniciar Sesión</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-cream: #FAF8F5;
            --purple-dark: #2A1654;
            --purple-light: #6339A6;
            --purple-pale: #F2EDFA;
            --text-color: #2A1654;
            --text-muted: #4E4266;
            --border-suave: #E6E1ED;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-cream);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-banner-header {
            width: 100%;
            height: 180px;
            background-color: #F1EBE1;
            border-bottom: 1px solid var(--border-suave);
            overflow: hidden;
        }

        .hero-banner-header img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            padding: 35px;
            width: 100%;
            max-width: 420px;
            margin-top: 40px;
            border: 1px solid var(--border-suave);
            box-shadow: 0 10px 25px rgba(42, 22, 84, 0.05);
            text-align: center;
        }

        .login-card h2 {
            font-size: 22px;
            color: var(--purple-dark);
            margin-bottom: 8px;
        }

        .login-card p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-suave);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .btn-submit {
            background-color: var(--purple-dark);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--purple-light);
        }
    </style>
</head>
<body>

    <header class="hero-banner-header">
        <img src="assets/Encabezado-Web.png" alt="NeuroClarity Banner">
    </header>

    <div class="login-card">
        <h2>Bienvenido a NeuroClarity</h2>
        <p>Selecciona tu tipo de cuenta e ingresa a tu portal</p>

        <form id="formLogin">
            <div class="form-group">
                <label>Tipo de Usuario / Portal</label>
                <select class="form-control" id="selectRolUsuario">
                    <option value="panel-padre.html">Padre de Familia (Portal Familiar)</option>
                    <option value="profesor.html">Profesor / Especialista</option>
                    <option value="alumno.html">Alumno (Estudio PWA)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" class="form-control" id="loginEmail" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" class="form-control" id="loginPass" placeholder="******" required>
            </div>

            <button type="submit" class="btn-submit">Ingresar al Portal</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB_KGcAMdYLqKTFr0XQJkVnSVuX2LbKq4Q",
            authDomain: "neuroclarity-dcf0e.firebaseapp.com",
            projectId: "neuroclarity-dcf0e",
            storageBucket: "neuroclarity-dcf0e.firebasestorage.app",
            messagingSenderId: "34116345239",
            appId: "1:34116345239:web:0bd6a7484a7f2ff081f8d2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById("formLogin").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value;
            const pass = document.getElementById("loginPass").value;
            const destino = document.getElementById("selectRolUsuario").value;

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                window.location.href = destino;
            } catch (err) {
                // Si la cuenta aún no existe en Firebase Auth, te redirige directamente para pruebas
                window.location.href = destino;
            }
        });
    </script>
</body>
</html>
