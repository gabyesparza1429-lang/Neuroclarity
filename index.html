<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <title>NeuroClarity - Ingeniería Pedagógica</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-cream: #FAF8F5;
            --purple-dark: #2A1654;
            --purple-light: #6339A6;
            --purple-pale: #F2EDFA;
            --white: #FFFFFF;
            --text-muted: #4E4266;
            --font-main: 'Outfit', sans-serif;
            --border-suave: #E6E1ED;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-cream);
            color: var(--purple-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .hero-banner-header {
            position: relative;
            width: 100%;
            height: 200px;
            background-color: #F1EBE1;
            border-bottom: 1px solid var(--border-suave);
            overflow: hidden;
        }

        .hero-banner-header .banner-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .nav-actions-overlay {
            position: absolute;
            top: 24px;
            right: 40px;
            display: flex;
            gap: 16px;
            z-index: 10;
        }

        .btn {
            font-family: var(--font-main);
            font-size: 15px;
            font-weight: 500;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-login {
            background-color: rgba(255, 255, 255, 0.9);
            color: var(--purple-dark);
            border: 1px solid rgba(42, 22, 84, 0.2);
            backdrop-filter: blur(4px);
        }

        .btn-login:hover {
            background-color: var(--white);
            transform: translateY(-1px);
        }

        .btn-primary {
            background-color: var(--purple-dark);
            color: var(--white);
            border: none;
            box-shadow: 0 4px 12px rgba(42, 22, 84, 0.15);
        }

        .btn-primary:hover {
            background-color: var(--purple-light);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--purple-light);
            color: var(--white);
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
        }

        .btn-secondary:hover {
            background-color: var(--purple-dark);
            transform: translateY(-1px);
        }

        .hero-text-block {
            padding: 50px 0 70px 0;
            text-align: center;
        }

        .hero-text-block h1 {
            font-size: 32px; 
            font-weight: 700;
            line-height: 1.3;
            max-width: 800px;
            margin: 0 auto 20px auto;
            letter-spacing: -0.5px;
        }

        .hero-text-block p {
            font-size: 17px;
            color: var(--text-muted);
            max-width: 700px;
            margin: 0 auto 32px auto;
        }

        .science {
            padding: 80px 0;
            background-color: var(--white);
            border-top: 1px solid rgba(42, 22, 84, 0.04);
            border-bottom: 1px solid rgba(42, 22, 84, 0.04);
        }

        .section-header {
            max-width: 900px;
            margin-bottom: 48px;
        }

        .section-header h2 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .section-header p {
            font-size: 16px;
            color: var(--text-muted);
            line-height: 1.7;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .feature-card {
            background-color: var(--bg-cream);
            padding: 32px;
            border-radius: 12px;
            border: 1px solid rgba(42, 22, 84, 0.04);
        }

        .feature-card h3 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--purple-light);
        }

        .feature-card p {
            font-size: 15px;
            color: var(--text-muted);
        }

        .pricing-section {
            padding: 80px 0;
            text-align: center;
        }

        .pricing-section h2 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .pricing-section .sub-title {
            font-size: 17px;
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        .tab-container {
            display: inline-flex;
            background-color: var(--purple-pale);
            padding: 6px;
            border-radius: 12px;
            margin-bottom: 50px;
            border: 1px solid var(--border-suave);
        }

        .tab-btn {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            background: none;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--white);
            color: var(--purple-dark);
            box-shadow: 0 4px 10px rgba(42, 22, 84, 0.05);
        }

        .pricing-view {
            display: none;
            max-width: 1000px;
            margin: 0 auto;
            animation: fadeIn 0.3s ease;
        }

        .pricing-view.active {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            justify-content: center;
        }

        .pricing-card {
            background-color: var(--white);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid var(--border-suave);
            box-shadow: 0 10px 30px rgba(42, 22, 84, 0.02);
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .pricing-card.centered-card {
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        .pricing-card h3 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .pricing-card .price {
            font-size: 38px;
            font-weight: 700;
            color: var(--purple-light);
            margin-bottom: 25px;
        }

        .pricing-card .price span {
            font-size: 16px;
            font-weight: 400;
            color: var(--text-muted);
        }

        .benefits-list {
            list-style: none;
            margin-bottom: 35px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .benefits-list li {
            font-size: 15px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .benefits-list li::before {
            content: "✓";
            color: var(--purple-light);
            font-weight: bold;
            font-size: 18px;
        }

        .license-counter-box {
            background-color: var(--bg-cream);
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border: 1px solid var(--border-suave);
        }

        .license-counter-box label {
            font-weight: 600;
            font-size: 15px;
        }

        .license-counter-box select {
            padding: 8px 15px;
            font-size: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-suave);
            background: var(--white);
            color: var(--purple-dark);
            font-weight: 600;
            outline: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer {
            background-color: var(--purple-dark);
            color: rgba(255, 255, 255, 0.8);
            padding: 40px 0;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .nav-actions-overlay {
                position: relative;
                top: 0;
                right: 0;
                padding: 16px;
                justify-content: center;
                background-color: var(--bg-cream);
            }
            .hero-text-block h1 { font-size: 26px; }
            .section-header h2, .pricing-section h2 { font-size: 24px; }
            .pricing-view.active { grid-template-columns: 1fr; }
        }

        /* MODAL DE AUTENTICACIÓN (LOGIN Y REGISTRO AUTOMÁTICO) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(42, 22, 84, 0.5);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        
        .modal-card {
            background: var(--white);
            padding: 35px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(42, 22, 84, 0.2);
            position: relative;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }
        
        .modal-close {
            position: absolute;
            top: 16px; right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-muted);
            background: none;
            border: none;
            font-weight: bold;
        }

        .auth-tab-group {
            display: flex;
            border-bottom: 2px solid var(--border-suave);
            margin-bottom: 20px;
        }

        .auth-tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
        }

        .auth-tab-btn.active {
            color: var(--purple-dark);
            border-bottom: 3px solid var(--purple-dark);
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 13px;
            color: var(--text-muted);
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-suave);
            border-radius: 8px;
            font-family: var(--font-main);
            font-size: 14px;
            outline: none;
            color: var(--purple-dark);
            background-color: var(--white);
        }
        
        .form-group input:focus, .form-group select:focus {
            border-color: var(--purple-light);
        }
    </style>
</head>
<body>

    <header class="hero-banner-header">
        <img src="assets/Encabezado-Web.png" alt="NeuroClarity Banner" class="banner-img">
        
        


<div style="text-align: center; padding: 20px; background: #FAF8F5;">
    <a href="alumno.html" style="display: inline-block; padding: 15px 30px; background-color: #6339A6; color: #ffffff; text-decoration: none; border-radius: 12px; font-weight: bold; font-size: 18px; box-shadow: 0 4px 15px rgba(99, 57, 166, 0.4);">
        🎓 Acceso Alumnos
    </a>
</div>

</body>
</html>
