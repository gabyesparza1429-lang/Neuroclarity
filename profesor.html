<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroClarity - Portal Profesor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f4f1ea; color: #333; }
        .banner { width: 100%; text-align: center; background: #eae6df; border-bottom: 1px solid #d6c7ec; }
        .banner img { width: 100%; height: auto; display: block; }
        .main-container { display: flex; max-width: 1200px; margin: 20px auto; gap: 20px; padding: 0 15px; }
        .sidebar { width: 260px; background: white; border-radius: 12px; padding: 15px; border: 1px solid #d6c7ec; flex-shrink: 0; height: fit-content; }
        .sidebar-btn { width: 100%; padding: 12px 10px; margin-bottom: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; text-align: left; border: 1px solid #ccc; background: white; color: #333; }
        .sidebar-btn.primary { background: #6339a6; color: white; border: none; }
        .content { flex-grow: 1; background: white; border-radius: 12px; padding: 25px; border: 1px solid #d6c7ec; }
        .student-card { background: #f9f7fc; padding: 18px; border-radius: 10px; border: 1px solid #d6c7ec; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .student-card h2 { color: #4a2372; font-size: 22px; font-weight: bold; }
        .btn-danger { background: #dc3545; color: white; border: none; padding: 10px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 6px; color: #6339a6; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .btn-action { width: 100%; background: #2e7d32; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; }
        .modal-box { background: white; width: 90%; max-width: 420px; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div class="banner">
        <img src="assets/Encabezado-Web.png" alt="NeuroClarity">
    </div>

    <div class="main-container">
        <div class="sidebar">
            <button type="button" class="sidebar-btn primary" onclick="abrirModalAlumno()">➕ Vincular / Agregar Alumno</button>
            <button type="button" class="sidebar-btn primary" onclick="mostrarSeccion('panel')">🎓 Panel Alumno</button>
            <button type="button" class="sidebar-btn" onclick="alert('Módulo de subir planeación en desarrollo')">☁️ Subir Planeación</button>
            <button type="button" class="sidebar-btn" onclick="alert('Abriendo chat directo con el tutor')">💬 Mensajería Directa</button>
            <button type="button" class="sidebar-btn" onclick="alert('No hay observaciones pendientes')">📋 Observaciones Dirección</button>
            <button type="button" class="sidebar-btn" onclick="alert('Genera primero la propuesta con Sofía IA')">🪄 Materiales Sofía</button>
        </div>

        <div class="content">
            <div id="contenedorAlumno" class="student-card">
                <div>
                    <h2 id="nombreAlumnoDocente">Monse</h2>
                    <p style="margin-top:5px; color:#555; font-size:14px;">Grado: <span id="gradoAlumnoDocente" style="font-weight:bold; color:#333;">Francés adultos</span> | Código: <b id="codigoAlumnoDocente" style="color:#6339a6;">NC-4105</b></p>
                </div>
                <button type="button" class="btn-danger" onclick="eliminarAlumno()">🗑️ Eliminar Alumno</button>
            </div>

            <div class="form-group">
                <label>✏️ Asignar Materia y Tema Dinámico:</label>
                <input type="text" class="form-control" id="temaDinamico" value="Je me présente">
            </div>

            <div class="form-group">
                <label>📅 Ritmo Recomendado (Ventana Flexible):</label>
                <input type="date" class="form-control" id="fechaRitmo" value="2026-08-30">
            </div>

            <button type="button" class="btn-action" onclick="generarPropuestaSofia()">🤖 Generar propuesta con Sofía IA y Revisar</button>
        </div>
    </div>

    <div id="modalAgregarAlumno" class="modal-overlay">
        <div class="modal-box">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #D6C7EC; padding-bottom:10px; margin-bottom:15px;">
                <h3 style="margin:0; color:#6339a6; font-size:18px;">🔗 Vincular Alumno por Código</h3>
                <button type="button" onclick="cerrarModalAlumno()" style="background:none; border:none; font-size:20px; cursor:pointer; color:#666;">✖</button>
            </div>
            <p style="font-size:13px; color:#555; margin-bottom:15px;">Ingresa el código único del alumno para cargar sus datos.</p>
            <div style="margin-bottom:15px;">
                <label style="display:block; font-weight:bold; margin-bottom:5px; color:#333; font-size:13px;">Código del Alumno:</label>
                <input type="text" id="inputCodigoVincular" placeholder="EJ. NC-4105" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:15px; text-transform:uppercase;">
            </div>
            <button type="button" onclick="vincularAlumnoPorCodigo()" style="width:100%; background:#6339a6; color:white; border:none; padding:12px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:14px;">Cargar Datos</button>
        </div>
    </div>

    <script>
    function abrirModalAlumno() {
        var m = document.getElementById('modalAgregarAlumno');
        if (m) m.style.display = 'flex';
    }

    function cerrarModalAlumno() {
        var m = document.getElementById('modalAgregarAlumno');
        if (m) m.style.display = 'none';
    }

    function vincularAlumnoPorCodigo() {
        var input = document.getElementById('inputCodigoVincular');
        var cod = input ? input.value.trim().toUpperCase() : '';
        if (!cod) {
            alert('Por favor ingresa el código del alumno.');
            return;
        }
        alert('✅ Alumno ' + cod + ' vinculado con éxito.');
        cerrarModalAlumno();
    }

    function eliminarAlumno() {
        if (confirm('¿Deseas desvincular a este alumno del panel?')) {
            var elem = document.getElementById('contenedorAlumno');
            if (elem) elem.style.display = 'none';
            alert('✅ Alumno desvinculado del panel.');
        }
    }

    function mostrarSeccion(seccion) {
        alert('Vista actual: ' + seccion);
    }

    function generarPropuestaSofia() {
        alert('🤖 Sofía IA está procesando la propuesta pedagógica...');
    }
    </script>
</body>
</html>
