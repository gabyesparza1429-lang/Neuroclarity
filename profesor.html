<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <title>NeuroClarity | Portal del Profesor</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-cream: #FAF8F5;
            --sidebar-bg: #EFECE6;
            --purple-dark: #2A1654;
            --purple-light: #6339A6;
            --purple-pale: #F2EDFA;
            --text-color: #2A1654;
            --text-muted: #4E4266;
            --card-bg: #FFFFFF;
            --border-radius: 12px;
            --border-suave: #E6E1ED;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg-cream); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; }

        .hero-banner-header { width: 100%; height: 180px; background-color: #F1EBE1; border-bottom: 1px solid var(--border-suave); overflow: hidden; }
        .hero-banner-header img { width: 100%; height: 100%; object-fit: contain; display: block; }

        .app-body { display: flex; flex: 1; }
        .sidebar { width: 260px; background-color: var(--sidebar-bg); padding: 30px 20px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid var(--border-suave); }

        .sidebar-btn {
            display: flex; align-items: center; gap: 12px; padding: 14px 20px; border: none; background: none;
            border-radius: var(--border-radius); cursor: pointer; text-align: left; font-size: 15px; color: var(--text-color); font-weight: 500;
        }
        .sidebar-btn.active, .sidebar-btn:hover { background-color: var(--purple-pale); color: var(--purple-dark); font-weight: 700; }

        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .header-panel { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header-title h1 { font-size: 26px; font-weight: 700; color: var(--purple-dark); }
        .header-title p { font-size: 14px; color: var(--text-muted); }

        .btn-primary { background-color: var(--purple-dark); color: white; border: none; padding: 12px 24px; border-radius: var(--border-radius); font-weight: 600; cursor: pointer; }
        .btn-primary:hover { background-color: var(--purple-light); }

        .panel-section { display: none; }
        .panel-section.active { display: block; }

        .student-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; margin-top: 20px; }
        .student-card { background: var(--card-bg); border-radius: var(--border-radius); padding: 24px; border: 1px solid var(--border-suave); display: flex; flex-direction: column; justify-content: space-between; }
        
        .badge-profile { display: inline-block; padding: 6px 12px; font-size: 12px; border-radius: 20px; font-weight: 700; background: var(--purple-pale); color: var(--purple-dark); margin-bottom: 12px; }

        .empty-state {
            background: white;
            border: 2px dashed var(--border-suave);
            border-radius: 16px;
            padding: 48px 24px;
            text-align: center;
            color: var(--text-muted);
            margin-top: 20px;
        }

        .card-panel { background: white; border: 1px solid var(--border-suave); border-radius: 16px; padding: 24px; margin-bottom: 20px; }

        /* ESTILOS DEL CHAT EN TIEMPO REAL */
        .msg-bubble { max-width: 80%; padding: 10px 14px; border-radius: 10px; font-size: 13px; line-height: 1.4; word-break: break-word; }
        .msg-bubble.sent { align-self: flex-end; background-color: var(--purple-dark); color: white; }
        .msg-bubble.received { align-self: flex-start; background-color: var(--bg-cream); border: 1px solid var(--border-suave); color: var(--purple-dark); }

        .item-chat-familia {
            padding: 10px 12px; border-radius: 8px; background: white; border: 1px solid var(--border-suave);
            cursor: pointer; transition: all 0.2s ease; text-align: left;
        }
        .item-chat-familia:hover, .item-chat-familia.active { background: var(--purple-pale); border-color: var(--purple-light); }

        /* MODALES */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(42, 22, 84, 0.5); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 32px; border-radius: var(--border-radius); width: 100%; max-width: 480px; position: relative; }
        .close-modal { position: absolute; top: 16px; right: 20px; font-size: 24px; cursor: pointer; color: #aaa; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }
        .form-control { width: 100%; padding: 10px 14px; border: 1px solid var(--border-suave); border-radius: 8px; font-size: 14px; outline: none; }
    </style>


<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

    const firebaseConfig = {
        authDomain: "neuroclarity-dcf0e.firebaseapp.com",
        projectId: "neuroclarity-dcf0e",
        storageBucket: "neuroclarity-dcf0e.firebasestorage.app"
    };
    const app = initializeApp(firebaseConfig, "profesorLimpioApp");
    const db = getFirestore(app);

    window.revisarYAutorizar = function() {
        const modal = document.getElementById('modalPlanSofia') || document.getElementById('modalPreview');
        if (modal) modal.style.display = 'block';
    };

    window.cerrarModal = function() {
        const modal = document.getElementById('modalPlanSofia') || document.getElementById('modalPreview');
        if (modal) modal.style.display = 'none';
    };

    window.autorizarYPublicar = async function() {
        const codigo = 'NC-4105';
        const materiaTema = 'Historia: Revolución Mexicana';
        
        try {
            await addDoc(collection(db, "vinculaciones"), {
                codigo_vinculo: codigo,
                materia: materiaTema,
                fecha_creacion: serverTimestamp(),
                estado: "Asignada"
            });
            alert('¡Lección de Historia autorizada y enviada al alumno!');
            window.cerrarModal();
        } catch(e) {
            console.error('Error al guardar en Firebase:', e);
            alert('Error al publicar la lección: ' + e.message);
        }
    };

    document.addEventListener('DOMContentLoaded', () => {
        const btns = document.querySelectorAll('button');
        btns.forEach(btn => {
            const txt = btn.innerText.trim();
            if (txt.includes('Revisar y Autorizar')) {
                btn.onclick = window.revisarYAutorizar;
            } else if (txt.includes('Autorizar y Publicar')) {
                btn.onclick = window.autorizarYPublicar;
            } else if (txt.includes('Cerrar')) {
                btn.onclick = window.cerrarModal;
            }
        });
    });
</script>
</body>
</html>
