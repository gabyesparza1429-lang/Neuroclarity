<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroClarity - Portal del Profesor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-brand: #F4EFEA;
            --card-bg: #FFFFFF;
            --primary: #6339A6;
            --text-dark: #2D223B;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-brand);
            color: var(--text-dark);
            margin: 0;
            padding: 0 0 50px 0;
        }
        .top-header {
            width: 100%;
            background-color: #F4EFEA;
            margin: 0 0 30px 0;
            padding: 0;
            border-bottom: 1px solid #E8E2D9;
        }
        .top-header img {
            width: 100%;
            max-width: 900px;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .main-layout {
            display: flex;
            max-width: 1100px;
            margin: 0 auto;
            gap: 20px;
            padding: 0 20px;
        }
        .sidebar {
            width: 230px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            height: fit-content;
        }
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            color: var(--text-dark);
            font-weight: 600;
            cursor: pointer;
            border-radius: 10px;
            margin-bottom: 8px;
            transition: all 0.2s ease;
        }
        .sidebar-item:hover, .sidebar-item.active {
            background: #6339A6;
            color: white;
        }
        .content-area { flex: 1; }
        .student-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            margin-bottom: 20px;
        }
        .student-title { font-size: 26px; font-weight: 800; color: #2D223B; margin: 0 0 4px 0; }
        .student-sub { color: var(--primary); font-size: 14px; font-weight: bold; margin-bottom: 20px; }
        .ritmo-box {
            margin-bottom: 20px;
            background: #FAF9FC;
            padding: 14px;
            border-radius: 12px;
            border: 1px dashed var(--primary);
        }
        .bloom-section {
            border: 1px solid #EAE5ED;
            border-radius: 12px;
            padding: 18px;
            background: #FAF9FC;
            margin-bottom: 20px;
        }
        .bloom-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            color: var(--primary);
            font-size: 16px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 99999;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            width: 90%;
            max-width: 420px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<header class="top-header">
    <img src="assets/Encabezado-Web.png" alt="NeuroClarity Banner">
</header>

<div class="main-layout">
    <div class="sidebar">
        <button type="button" onclick="alert('No hay observaciones pendientes')" style="width:100%; background:white; color:#333; border:1px solid #ccc; padding:12px 10px; border-radius:8px; font-weight:bold; cursor:pointer; font-size:13px; margin-bottom:10px;">📋 Observaciones Dirección</button>
        </div>
        <p style="font-size:13px; color:#555; margin-bottom:15px;">Ingresa el código único del alumno para cargar sus datos y Perfil de Sofía.</p>
        <div style="margin-bottom:15px;">
            <label style="display:block; font-weight:bold; margin-bottom:5px; color:#333; font-size:13px;">Código del Alumno:</label>
            <input type="text" id="inputCodigoVincular" placeholder="Ej. NC-4105" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:15px; text-transform:uppercase; box-sizing:border-box;">
        </div>
        <button type="button" onclick="vincularAlumnoPorCodigo()" style="width:100%; background:#6339a6; color:white; border:none; padding:12px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:14px;">
            Cargar Datos
        </button>
    </div>
</div>






<script>
function abrirModalAlumno() {
    var m = document.getElementById('modalAgregarAlumno');
    if (m) m.style.display = 'flex';
}

function cerrarModalAlumno() {
    var m = document.getElementById('modalAgregarAlumno');
    if (m) m.style.display = 'none';
}

function vincularAlumnoPorCodigo() {
    var input = document.getElementById('inputCodigoVincular');
    var cod = input ? input.value.trim().toUpperCase() : '';
    if (code = code.replace(site-delf, )) {
        alert('Por favor ingresa el código del alumno.');
        return;
    }
    alert('✅ Alumno ' + cod + ' vinculado con éxito.');
    cerrarModalAlumno();
}

function eliminarAlumno() {
    if (confirm('¿Deseas desvincular a este alumno del panel?')) {
        var elem = document.getElementById('contenedorAlumno');
        if (elem) elem.style.display = 'none';
        alert('✅ Alumno desvinculado del panel.');
    }
}

function mostrarSeccion(seccion) {
    alert('Navegando a ' + seccion);
}

async function cargarDatosAlumnoFirestore(codigo) {
    try {
        const querySnapshot = await db.collection('alumnos').where('codigo', '==', codigo).get();
            const alumno = querySnapshot.docs[0].data();
            document.getElementById('nombreAlumnoDocente').innerText = alumno.nombre || 'Monse';
            document.getElementById('gradoAlumnoDocente').innerText = alumno.grado || 'Francés adultos';
        }
    } catch (e) {
        console.error('Error:', e);
    }
}

window.addEventListener('DOMContentLoaded', () => {
    cargarDatosAlumnoFirestore('NC-4105');
});
</script>

</body>
</html>
