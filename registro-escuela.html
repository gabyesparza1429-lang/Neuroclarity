<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroClarity | Registro Institucional</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6b46c1;
      --primary-hover: #553c9a;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      max-width: 560px;
      width: 100%;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid var(--border);
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    .btn-submit {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .helper-text {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>NeuroClarity Escuelas</h1>
      <p>Configura la cuenta institucional para tu colegio y activa tus licencias.</p>
    </div>

    <form id="formRegistroEscuela">
      <div class="form-group">
        <label for="nombreEscuela">Nombre de la Institución / Colegio</label>
        <input type="text" id="nombreEscuela" placeholder="Ej. Instituto Pedagógico del Valle" required>
      </div>

      <div class="form-group">
        <label for="nombreDirector">Nombre del Responsable / Director</label>
        <input type="text" id="nombreDirector" placeholder="Nombre completo" required>
      </div>

      <div class="form-group">
        <label for="emailEscuela">Correo Electrónico Institucional</label>
        <input type="email" id="emailEscuela" placeholder="director@colegio.edu.mx" required>
      </div>

      <div class="form-group">
        <label for="passwordEscuela">Contraseña para el Panel Admin</label>
        <input type="password" id="passwordEscuela" placeholder="Mínimo 8 caracteres" required minlength="8">
      </div>

      <div class="form-group">
        <label for="correosDocentes">Correos de Profesores a Vincular (Opcional)</label>
        <textarea id="correosDocentes" rows="3" placeholder="Ingresa los correos separados por coma (ej. maestros@colegio.edu.mx)"></textarea>
        <p class="helper-text">Podrás agregar o modificar profesores más adelante desde tu panel de control.</p>
      </div>

      <button type="submit" class="btn-submit">Activar Cuenta Escolar</button>
    </form>
  </div>

</body>
</html>
